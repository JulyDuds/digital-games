<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake | Digital Detective Games</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #c0c0c0;
            overflow: auto;
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            margin: 20px auto;
            max-width: 300px;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 70px);
            grid-template-rows: repeat(3, 70px);
            gap: 5px;
            justify-content: center;
        }

        .control-btn {
            background: #c0c0c0;
            border: 2px solid;
            border-color: #ffffff #000000 #000000 #ffffff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: #000000;
        }

        .control-btn:active {
            border-color: #000000 #ffffff #ffffff #000000;
        }

        .control-btn i {
            color: var(--accent);
        }

        #up-btn {
            grid-column: 2;
            grid-row: 1;
        }

        #left-btn {
            grid-column: 1;
            grid-row: 2;
        }

        #right-btn {
            grid-column: 3;
            grid-row: 2;
        }

        #down-btn {
            grid-column: 2;
            grid-row: 3;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="score">
                <div class="wins"><i class="fas fa-trophy"></i> <span id="score">0</span></div>
                <div class="losses"><i class="fas fa-clock"></i> <span id="time">00:00</span></div>
            </div>
        </header>

        <main class="game-area">
            <div class="game-info">
                <div class="info-item">
                    <i class="fas fa-star"></i>
                    <span>Pontos: <span id="current-score">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-trophy"></i>
                    <span>Recorde: <span id="high-score">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Velocidade: <span id="speed">1</span></span>
                </div>
            </div>

            <div class="game-status" id="game-status">
                Use as setas para começar!
            </div>

            <canvas class="game-canvas" id="game-canvas" width="600" height="400"></canvas>

            <div class="instructions">
                <strong>Controles:</strong> Use as setas ← ↑ → ↓ para mover a cobra. Pressione ESPAÇO para pausar.
            </div>

            <div class="mobile-controls">
                <div class="d-pad">
                    <button id="up-btn" class="control-btn"><i class="fas fa-arrow-up"></i></button>
                    <button id="left-btn" class="control-btn"><i class="fas fa-arrow-left"></i></button>
                    <button id="right-btn" class="control-btn"><i class="fas fa-arrow-right"></i></button>
                    <button id="down-btn" class="control-btn"><i class="fas fa-arrow-down"></i></button>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="start-btn">
                    <i class="fas fa-play"></i> Iniciar
                </button>
                <button class="btn" id="pause-btn" disabled>
                    <i class="fas fa-pause"></i> Pausar
                </button>
                <button class="btn" id="sound-btn">
                    <i class="fas fa-volume-up"></i> Som
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; <span id="current-year"></span> Digital Detective Games. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="js/footer.js"></script>
    <script src="js/snake.js"></script>
</body>
</html>
