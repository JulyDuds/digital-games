<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong | Digital Detective Games</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #c0c0c0;
            overflow: auto;
        }

        .game-canvas {
            display: block;
            margin: 20px auto;
            border: 3px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #000000;
        }

        .game-info {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .score-label {
            font-size: 1rem;
            color: var(--secondary);
        }

        .score-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--accent);
            font-family: 'Fira Code', monospace;
        }

        .game-status {
            text-align: center;
            font-size: 1.5rem;
            padding: 20px;
            color: var(--light);
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            padding: 20px;
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="score">
                <div class="wins"><i class="fas fa-trophy"></i> <span id="wins">0</span></div>
                <div class="losses"><i class="fas fa-gamepad"></i> <span id="games">0</span></div>
            </div>
        </header>

        <main class="game-area">
            <div class="difficulty-selector">
                <button class="difficulty-btn" data-difficulty="easy">Fácil</button>
                <button class="difficulty-btn active" data-difficulty="medium">Médio</button>
                <button class="difficulty-btn" data-difficulty="hard">Difícil</button>
            </div>

            <div class="game-info">
                <div class="score-item">
                    <div class="score-label">Jogador</div>
                    <div class="score-value" id="player-score">0</div>
                </div>
                <div class="score-item">
                    <div class="score-label">IA</div>
                    <div class="score-value" id="ai-score">0</div>
                </div>
            </div>

            <div class="game-status" id="game-status">
                Clique em Iniciar para começar!
            </div>

            <canvas class="game-canvas" id="game-canvas" width="800" height="500"></canvas>

            <div class="instructions">
                <strong>Controles:</strong> Use as setas ↑ e ↓ ou W e S para mover a raquete
            </div>

            <div class="controls">
                <button class="btn" id="start-btn">
                    <i class="fas fa-play"></i> Iniciar
                </button>
                <button class="btn" id="pause-btn" disabled>
                    <i class="fas fa-pause"></i> Pausar
                </button>
                <button class="btn" id="sound-btn">
                    <i class="fas fa-volume-up"></i> Som
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; <span id="current-year"></span> Digital Detective Games. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="js/footer.js"></script>
    <script src="js/pong.js"></script>
</body>
</html>
