<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalGames - Login</title>
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.svg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-window">
            <div class="login-titlebar">
                <div class="title">
                    <i class="fas fa-shield-alt"></i>
                    <span>DigitalGames - Login</span>
                </div>
                
            </div>
            
            <div class="login-content">
                <div class="login-header">
                    <img src="assets/img/DigitalDetective.svg" alt="DigitalGames">
                    <h1>DigitalGames</h1>
                    <p>Bem-vindo ao sistema de jogos retro!</p>
                </div>

                <div id="error-message" class="error-message"></div>
                <div id="success-message" class="success-message"></div>

                <form id="loginForm" method="POST" action="login.php">
                    <div class="form-group">
                        <label for="username">
                            <i class="fas fa-user"></i> Nome de Usuário:
                        </label>
                        <input type="text" id="username" name="username" required 
                               placeholder="Digite seu nome de usuário" autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> Senha:
                        </label>
                        <input type="password" id="password" name="password" required 
                               placeholder="Digite sua senha" autocomplete="current-password">
                    </div>

                    <div class="login-buttons">
                        <button type="button" class="btn" onclick="showHelp()">
                            <i class="fas fa-question-circle"></i> Ajuda
                        </button>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt"></i> Entrar
                        </button>
                    </div>
                </form>

                <div class="login-footer">
                    <p>© 2024 DigitalGames. Todos os direitos reservados.</p>
                    <p>Versão 1.0.0 - Sistema Windows 98 Style</p>
                    <p style="margin-top: 10px;">Não tem uma conta? <a href="register.html">Registre-se aqui</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Efeitos sonoros do Windows 98
        function playSound(frequency, duration, gain = 0.1) {
            if (!DDGConfig.audio.enabled) return;
            
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
            gainNode.gain.setValueAtTime(gain, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + duration);
        }

        // Configurações globais (simplificadas para login)
        const DDGConfig = {
            audio: {
                enabled: true,
                sounds: {
                    click: { frequency: 600, duration: 0.1, gain: 0.15 },
                    error: { frequency: 200, duration: 0.3, gain: 0.2 },
                    success: { frequency: 800, duration: 0.4, gain: 0.25 }
                }
            }
        };

        // Efeitos de interação
        document.addEventListener('DOMContentLoaded', function() {
            // Adicionar efeitos sonoros aos botões
            const buttons = document.querySelectorAll('.btn');
            buttons.forEach(btn => {
                btn.addEventListener('click', () => playSound(600, 0.1, 0.15));
            });

            // Efeito de foco nos inputs
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => playSound(400, 0.05, 0.1));
            });

            // Validação do formulário
            const form = document.getElementById('loginForm');
            form.addEventListener('submit', function(e) {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;

                if (username.length < 3) {
                    e.preventDefault();
                    showError('Nome de usuário deve ter pelo menos 3 caracteres');
                    playSound(200, 0.3, 0.2);
                    return;
                }

                if (password.length < 4) {
                    e.preventDefault();
                    showError('Senha deve ter pelo menos 4 caracteres');
                    playSound(200, 0.3, 0.2);
                    return;
                }

                // Sucesso - som de confirmação
                playSound(800, 0.4, 0.25);
            });
        });

        function showError(message) {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('success-message');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }

        function showHelp() {
            playSound(600, 0.1, 0.15);
            alert('Ajuda do Sistema:\n\n' +
                  '• Nome de usuário: Digite seu nome (mínimo 3 caracteres)\n' +
                  '• Senha: Digite sua senha (mínimo 4 caracteres)\n\n' +
                  
                  'Usuários padrão:\n\n' +
                  
                  '• guest / guest123\n\n' +
                  'Pressione Enter para confirmar o login.');
        }
    </script>
</body>
</html>
