<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game | Digital Detective Games</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Roboto:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #c0c0c0;
            overflow: auto;
        }

        .game-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            max-width: 700px;
            width: 100%;
            margin: 20px auto;
            padding: 20px;
        }

        .card {
            aspect-ratio: 1;
            min-height: 120px;
            background: #c0c0c0;
            border: 3px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            transform-style: preserve-3d;
        }

        .card:hover:not(.flipped):not(.matched) {
            background: #d4d4d4;
        }

        .card:active:not(.flipped):not(.matched) {
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .card.flipped {
            background: #ffffff;
            color: #000000;
            border-color: #808080 #ffffff #ffffff #808080;
        }

        .card.matched {
            background: #00ff00;
            color: #000000;
            cursor: default;
            animation: match 0.5s;
        }

        @keyframes match {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .card-back {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000000;
            font-size: 3rem;
        }

        .card-front {
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
        }

        /* Mostrar front quando virada */
        .card.flipped .card-back {
            display: none;
        }

        .card.flipped .card-front {
            display: flex;
        }

        .card.matched .card-back {
            display: none;
        }

        .card.matched .card-front {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            
            <div class="score">
                <div class="wins"><i class="fas fa-trophy"></i> <span id="best-moves">∞</span></div>
                <div class="losses"><i class="fas fa-gamepad"></i> <span id="games">0</span></div>
            </div>
        </header>

        <main class="game-area">
            <div class="difficulty-selector">
                <button class="difficulty-btn" data-difficulty="easy">Fácil (4x3)</button>
                <button class="difficulty-btn active" data-difficulty="medium">Médio (4x4)</button>
                <button class="difficulty-btn" data-difficulty="hard">Difícil (6x4)</button>
            </div>

            <div class="game-info">
                <div class="info-item">
                    <i class="fas fa-hand-pointer"></i>
                    <span>Jogadas: <span id="moves">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-check-double"></i>
                    <span>Pares: <span id="pairs">0</span> / <span id="total-pairs">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span>Tempo: <span id="timer">0</span>s</span>
                </div>
            </div>

            <div class="game-status" id="game-status">
                Encontre todos os pares!
            </div>

            <div class="game-board" id="game-board"></div>

            <div class="controls">
                <button class="btn" id="restart-btn">
                    <i class="fas fa-sync-alt"></i> Novo Jogo
                </button>
                <button class="btn" id="sound-btn">
                    <i class="fas fa-volume-up"></i> Som
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; <span id="current-year"></span> Digital Detective Games. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="js/footer.js"></script>
    <script src="js/memory.js"></script>
</body>
</html>
