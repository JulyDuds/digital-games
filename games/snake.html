<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake | Digital Detective Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="score">
                <div class="wins"><i class="fas fa-trophy"></i> <span id="score">0</span></div>
                <div class="losses"><i class="fas fa-clock"></i> <span id="time">00:00</span></div>
            </div>
        </header>

        <main class="game-area snake-container">
            <div class="game-info">
                <div class="info-item">
                    <i class="fas fa-star"></i>
                    <span>Pontos: <span id="current-score">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-trophy"></i>
                    <span>Recorde: <span id="high-score">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Velocidade: <span id="speed">1</span></span>
                </div>
            </div>

            <div class="game-status" id="game-status">
                <i class="fas fa-play icon-red"></i> Clique em Iniciar para começar!
            </div>

            <canvas class="game-canvas" id="game-canvas" width="400" height="400"></canvas>

            <div class="instructions">
                <strong>Controles:</strong> Use as setas ← ↑ → ↓ para mover a cobra
            </div>

            <div class="mobile-controls">
                <div class="d-pad">
                    <button id="up-btn" class="control-btn"><i class="fas fa-arrow-up"></i></button>
                    <button id="left-btn" class="control-btn"><i class="fas fa-arrow-left"></i></button>
                    <button id="right-btn" class="control-btn"><i class="fas fa-arrow-right"></i></button>
                    <button id="down-btn" class="control-btn"><i class="fas fa-arrow-down"></i></button>
                </div>
            </div>

            <div class="controls">
                <button class="btn" id="start-btn">
                    <i class="fas fa-play"></i> Iniciar
                </button>
                <button class="btn" id="pause-btn" disabled>
                    <i class="fas fa-pause"></i> Pausar
                </button>
                <button class="btn" id="sound-btn">
                    <i class="fas fa-volume-up"></i> Som
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; <span id="current-year"></span> Digital Detective Games. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/snake.js"></script>
</body>
</html>
