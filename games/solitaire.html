<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paciência | Digital Detective Games</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="score">
                <div class="wins"><i class="fas fa-trophy"></i> <span id="wins">0</span></div>
                <div class="losses"><i class="fas fa-gamepad"></i> <span id="games">0</span></div>
            </div>
        </header>

        <main class="game-area solitaire-container">
            <div class="game-info">
                <div class="info-item">
                    <i class="fas fa-hand-pointer"></i>
                    <span>Movimentos: <span id="moves">0</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-clock"></i>
                    <span>Tempo: <span id="timer">00:00</span></span>
                </div>
                <div class="info-item">
                    <i class="fas fa-star"></i>
                    <span>Pontos: <span id="score">0</span></span>
                </div>
            </div>

            <div class="game-status" id="game-status">
                <i class="fas fa-flag icon-red"></i> Mova todas as cartas para as fundações!
            </div>

            <div class="solitaire-board">
                <div class="top-area">
                    <div class="deck-area">
                        <div class="card-pile" id="stock">
                            <div style="padding: 30px; text-align: center;">
                                <i class="fas fa-layer-group icon-red" style="font-size: 2rem;"></i>
                            </div>
                        </div>
                        <div class="card-pile empty" id="waste"></div>
                    </div>
                    
                    <div class="foundation-area">
                        <div class="card-pile empty foundation" data-suit="hearts" id="foundation-0">
                            <div class="suit-symbol"><i class="fas fa-heart icon-red" style="font-size: 2rem;"></i></div>
                        </div>
                        <div class="card-pile empty foundation" data-suit="diamonds" id="foundation-1">
                            <div class="suit-symbol"><i class="fas fa-gem icon-red" style="font-size: 2rem;"></i></div>
                        </div>
                        <div class="card-pile empty foundation" data-suit="clubs" id="foundation-2">
                            <div class="suit-symbol"><i class="fas fa-club icon-red" style="font-size: 2rem;"></i></div>
                        </div>
                        <div class="card-pile empty foundation" data-suit="spades" id="foundation-3">
                            <div class="suit-symbol"><i class="fas fa-spade icon-red" style="font-size: 2rem;"></i></div>
                        </div>
                    </div>
                </div>

                <div class="tableau-area" id="tableau"></div>
            </div>

            <div class="controls">
                <button class="btn" id="new-game-btn">
                    <i class="fas fa-sync-alt"></i> Novo Jogo
                </button>
                <button class="btn" id="hint-btn">
                    <i class="fas fa-lightbulb"></i> Dica
                </button>
                <button class="btn" id="sound-btn">
                    <i class="fas fa-volume-up"></i> Som
                </button>
                <button class="btn" id="undo-btn" title="Nenhum movimento para desfazer">
                    <i class="fas fa-undo"></i> Desfazer
                </button>
                <button class="btn" id="auto-complete-btn" style="display: none;" title="Auto-completar o jogo">
                    <i class="fas fa-robot"></i> Auto Completar
                </button>
            </div>
        </main>

        <footer class="footer">
            <p>&copy; <span id="current-year"></span> Digital Detective Games. Todos os direitos reservados.</p>
        </footer>
    </div>

    <script src="../assets/js/footer.js"></script>
    <script src="../assets/js/solitaire.js"></script>
</body>
</html>
